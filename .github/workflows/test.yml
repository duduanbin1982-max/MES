name: tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python (for cross-sub seed DB)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Syntax check (services + middleware + utils)
        run: |
          set -e
          ERR=0
          for f in $(find services middleware utils -name '*.js' 2>/dev/null); do
            if ! node --check "$f"; then
              echo "::error file=$f::SyntaxError"
              ERR=1
            fi
          done
          exit $ERR

      - name: Guard service DDL versions
        run: node scripts/check-service-schema-versions.js --base=HEAD^

      - name: Frontend typecheck
        run: npm run typecheck --prefix frontend

      - name: Frontend production build
        run: npm run build --prefix frontend

      - name: Run full test suite (incl. integration)
        run: bash scripts/run-all-tests.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            data/predeploy-*.log
            data/nightly-test.log
          if-no-files-found: ignore
          retention-days: 7
