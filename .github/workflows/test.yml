name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint + 部署闸门 + 前端
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python (集成测试的 seed DB 需要)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端依赖
        run: npm ci

      - name: 依赖安全审计（生产依赖，high 级阻断）
        run: npm run audit

      - name: 安装前端依赖
        run: npm ci --prefix frontend

      # 2026-10-17 新增：ESLint（error 阻断；存量 warning 不阻断）
      - name: ESLint 静态检查（warning 也阻断）
        run: npm run lint:strict

      - name: 服务 DDL 指纹守卫
        run: node scripts/check-service-schema-versions.js --base=HEAD^

      - name: 架构分层守卫
        run: node scripts/check-layer-boundaries.js

      - name: 路由唯一性守卫
        run: node scripts/check-duplicate-routes.js

      - name: 模块清单一致性守卫
        run: node scripts/check-module-manifest.js

      - name: 前端 ESLint（Vue + TS，warning 也阻断）
        run: npm run lint:strict --prefix frontend

      - name: 前端类型检查
        run: npm run typecheck --prefix frontend

      - name: 前端 domain 单测（无浏览器）
        run: npm run test:domain --prefix frontend

      - name: 前端生产构建
        run: npm run build --prefix frontend

      # 部署闸门（= 本地 pre-commit/pre-push/ExecStartPre 同一套；含 527 条用例）
      - name: 部署闸门（全套用例 + 语法 + ESLint + 前端 domain）
        run: bash scripts/pre-deploy-test.sh --quiet

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            logs/predeploy/*.log
            logs/*.log
          if-no-files-found: ignore
          retention-days: 7
