# TBM-MES 日志轮转配置
# 落盘位置：/etc/logrotate.d/factory-mes
# 源版本：/home/dubin/factory-mes/scripts/factory-mes-logrotate.conf（两份须保持一致）
#
# 2026-10-16 批次三 R4 修正要点：
#   1) size → maxsize。logrotate 中 size 会【覆盖】时间间隔（daily/weekly/monthly），
#      原配置 6 个条目因此从未触发轮转（logrotate 自身会打印 note: 'size' overrides ...）。
#      maxsize 语义为「到点轮转；若体积先超阈值则立即轮转」，两者取先到者。
#   2) 补齐两条未被任何规则覆盖的日志：logs/ops-daily-check.log、logs/restore-drill-local.log。
# 2026-10-16 批次四再补两条（新任务产生的日志一律同步登记，避免重演历史遗漏）：
#   4) logs/restore-drill-offsite.log —— 异地副本恢复演练（每周日 04:50，scripts/restore-drill-offsite.sh）
#   5) logs/predeploy-cleanup.log     —— predeploy 目录清理（每日 06:30，scripts/logs-predeploy-cleanup.sh）
#   3) 统一保留 copytruncate：本服务以 StandardOutput=append: 写 mes.log，进程持有 fd，
#      用 rename 方式轮转会使 systemd 继续写旧 inode（新文件永远为空），故必须 copytruncate。
#
# 维护约定：新增日志文件后须在此登记条目。历史上曾遗漏两条（上列第 2 点）。
# 校验命令：sudo /usr/sbin/logrotate -d /etc/logrotate.d/factory-mes

# 主服务日志：每日轮转，保留 14 天；超过 20M 立即轮转
/home/dubin/factory-mes/logs/mes.log {
    su dubin dubin
    daily
    rotate 14
    compress
    missingok
    notifempty
    copytruncate
    maxsize 20M
}

# 每日巡检日志：每日轮转，保留 14 天
