# factory-mes 反代配置 (HTTPS + 静态缓存)
upstream factory_mes_backend {
    server 127.0.0.1:3890;
    keepalive 16;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.1.73 _;
    return 301 https://$host$request_uri;
}

# HTTPS 主入口
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 192.168.1.73 _;

    ssl_certificate     /home/dubin/factory-mes/ssl/cert.pem;
    ssl_certificate_key /home/dubin/factory-mes/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 日志
    access_log /var/log/nginx/factory-mes.access.log;
    error_log  /var/log/nginx/factory-mes.error.log;

    # API 代理
    location /api/ {
        proxy_pass         http://factory_mes_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        proxy_pass         http://factory_mes_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        proxy_pass         http://factory_mes_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}
